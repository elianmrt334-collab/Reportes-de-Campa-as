            if (view === 'create' && window.appState.editingReportId) {

                    const fields = ['rep_title', 'rep_camp', 'rep_start', 'rep_end', 'rep_reach', 'rep_impressions', 'rep_res', 'rep_sec_res', 'rep_sec_label', 'rep_inv', 'rep_cpr', 'rep_demo1_age', 'rep_demo1_desc', 'rep_demo2_age', 'rep_demo2_desc', 'rep_summary', 'rep_conclusions', 'rep_analogy', 'rep_cost_analogy', 'rep_urgent_obs', 'rep_urgent_rec', 'rep_missed_rate'];
                    fields.forEach(f => {
                        const el = document.getElementById(f);
                        if(el) el.value = r[f.replace('rep_', '').replace(/(_)([a-z])/g, (m, p1, p2) => p2.toUpperCase())] || r[getMappedKey(f)] || '';

                        if (preview) { preview.src = r.reportImage; preview.classList.remove('hidden'); }

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const contents = [{ parts: [{ text: prompt }] }];
                    if (base64Image) contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents,
                            systemInstruction: { parts: [{ text: "Eres un analista director de marketing de COOSAJO. Extraes métricas de capturas de Ads y redactas presentaciones directas y ejecutivas. Tu estilo incluye analogías creativas de la vida diaria (ej. tienda, productos). Responde ÚNICAMENTE con el JSON solicitado." }] }
                        })
                    });
                    if (!response.ok) throw new Error("API error");
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) { if (i === 4) throw err; await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }

                const prompt = `Analiza la imagen o datos y devuelve EXACTAMENTE esta estructura JSON:
{ 
  "reportTitle": "Título corto", "campaignName": "Nombre", 
  "reach": 0, "impressions": 0, "results": 0, "secondaryResults": 0, "secondaryResultsLabel": "Ej: Contestados",
  "investment": 0.00, "costPerResult": 0.00,
  "demoTop1Age": "Ej: 25-34 años", "demoTop1Desc": "Breve descripción",
  "demoTop2Age": "Ej: 35-44 años", "demoTop2Desc": "Breve descripción",
  "executiveSummary": "Resumen de 2 párrafos", "conclusions": "Conclusión de 1 párrafo",
  "analogyText": "Analogía visual sobre el alcance.",
  "costAnalogyText": "Analogía sobre el costo comparado con algo de la vida diaria.",
  "urgentObs": "Si detectas una mala tasa de respuesta, escríbelo aquí (opcional)",
  "urgentRec": "Recomendaciones 1. 2. 3. (opcional)", "missedOppRate": 0
} Texto extra: ${text}`;
                const response = await callGemini(prompt, window.appState.lastAnalyzedImage);
                const jsonMatch = response.match(/\{[\s\S]*\}/);
                
                if (jsonMatch) {
                    const data = JSON.parse(jsonMatch[0]);
                    const m = (id, val) => { const el = document.getElementById(id); if(el && val !== undefined && val !== null) el.value = val; };
                    m('rep_title', data.reportTitle); m('rep_camp', data.campaignName);
                    m('rep_reach', data.reach); m('rep_impressions', data.impressions);
                    m('rep_res', data.results); m('rep_sec_res', data.secondaryResults); m('rep_sec_label', data.secondaryResultsLabel);
                    m('rep_inv', data.investment); m('rep_cpr', data.costPerResult);
                    m('rep_demo1_age', data.demoTop1Age); m('rep_demo1_desc', data.demoTop1Desc);
                    m('rep_demo2_age', data.demoTop2Age); m('rep_demo2_desc', data.demoTop2Desc);
                    m('rep_summary', data.executiveSummary); m('rep_conclusions', data.conclusions);
                    m('rep_analogy', data.analogyText); m('rep_cost_analogy', data.costAnalogyText);
                    m('rep_urgent_obs', data.urgentObs); m('rep_urgent_rec', data.urgentRec); m('rep_missed_rate', data.missedOppRate);
                }
                window.appState.aiChat.push({ role: 'assistant', text: "Presentación estructurada correctamente en el formulario." });
            } catch (err) { window.appState.aiChat.push({ role: 'assistant', text: "Error procesando el análisis." }); }
            finally {
                window.appState.aiLoading = false; window.appState.lastAnalyzedImage = null;
                input.value = ""; render();
                const win = document.getElementById('chatWindow'); if(win) win.scrollTop = win.scrollHeight;
            }
        };

        // --- MANEJO DE EVENTOS ---
        const setupEventListeners = () => {
            const bind = (id, event, handler) => { const el = document.getElementById(id); if(el) el.addEventListener(event, handler); };
            
            bind('loginForm', 'submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('username').value, p = document.getElementById('password').value;
                const user = window.appState.users.find(x => x.username === u && x.password === p);
                if (user) { window.appState.currentView = 'list'; render(); } 
                else { const err = document.getElementById('loginError'); err.textContent = 'Credenciales Incorrectas'; err.classList.remove('hidden'); }
            });

            bind('createForm', 'submit', async (e) => {
                e.preventDefault();
                let existingData = {};
                if (window.appState.editingReportId) {
                    const r = window.appState.reports.find(x => x.id === window.appState.editingReportId);
                    if (r) existingData = r;
                }

                const newReport = {
                    ...existingData,
                    id: window.appState.editingReportId || ('rep-' + Date.now()),
                    reportTitle: document.getElementById('rep_title').value,
                    campaignName: document.getElementById('rep_camp').value,
                    startDate: document.getElementById('rep_start').value,
                    endDate: document.getElementById('rep_end').value,
                    reach: Number(document.getElementById('rep_reach').value),
                    impressions: Number(document.getElementById('rep_impressions').value || 0),
                    results: Number(document.getElementById('rep_res').value),
                    secondaryResults: Number(document.getElementById('rep_sec_res').value || 0),
                    secondaryResultsLabel: document.getElementById('rep_sec_label').value,
                    investment: Number(document.getElementById('rep_inv').value),
                    costPerResult: Number(document.getElementById('rep_cpr').value || (document.getElementById('rep_inv').value / document.getElementById('rep_res').value)),
                    demoTop1Age: document.getElementById('rep_demo1_age').value,
                    demoTop1Desc: document.getElementById('rep_demo1_desc').value,
                    demoTop2Age: document.getElementById('rep_demo2_age').value,
                    demoTop2Desc: document.getElementById('rep_demo2_desc').value,
                    executiveSummary: document.getElementById('rep_summary').value,
                    conclusions: document.getElementById('rep_conclusions').value,
                    analogyText: document.getElementById('rep_analogy').value,
                    costAnalogyText: document.getElementById('rep_cost_analogy').value,
                    urgentObs: document.getElementById('rep_urgent_obs').value,
                    urgentRec: document.getElementById('rep_urgent_rec').value,
                    missedOppRate: Number(document.getElementById('rep_missed_rate').value || 0),
                    reportImage: window.appState.currentReportImage || existingData.reportImage || null,
                    status: 'FINALIZADA', 
                    createdAt: existingData.createdAt || new Date().toISOString()
                };
                
                if (window.appState.editingReportId) {
                    const idx = window.appState.reports.findIndex(r => r.id === window.appState.editingReportId);
                    window.appState.reports[idx] = newReport;
                } else { window.appState.reports.unshift(newReport); }

                if (isFirebaseEnabled && auth.currentUser) {
                    try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', newReport.id), newReport); } 
                    catch (err) { console.error(err); alert("Modo sin conexión temporal."); }
                }
                
                window.appState.editingReportId = null; window.appState.currentReportImage = null;
                window.appState.currentView = 'list'; render();
            });

            bind('aiImageInput', 'change', (e) => {
                const f = e.target.files[0]; if (!f) return;
                const r = new FileReader(); r.onload = (re) => { window.appState.lastAnalyzedImage = re.target.result.split(',')[1]; sendMessage(); };
                r.readAsDataURL(f);
            });
        };

        window.changeView = (v) => { window.appState.editingReportId = null; window.appState.currentReportImage = null; window.appState.currentView = v; render(); };
        window.logout = () => { window.appState.currentView = 'login'; render(); };
        window.openReport = (id) => { window.appState.selectedReport = window.appState.reports.find(r => r.id === id); window.appState.currentView = 'view'; render(); window.scrollTo(0,0); };
        window.editReport = (e, id) => { e.stopPropagation(); window.appState.editingReportId = id; window.appState.currentView = 'create'; render(); };
        window.cancelEdit = () => { window.appState.editingReportId = null; window.appState.currentReportImage = null; window.appState.currentView = 'list'; render(); };
        window.deleteReport = async (e, id) => { 
            e.stopPropagation(); 
            if(confirm("¿Eliminar este reporte permanentemente?")) { 
                window.appState.reports = window.appState.reports.filter(r => r.id !== id); render();
                if (isFirebaseEnabled && auth.currentUser) try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', id)); } catch(e){}
            } 
        };

        window.handleReportImageUpload = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (re) => {
                window.appState.currentReportImage = re.target.result;
                const preview = document.getElementById('rep_image_preview');
                if (preview) { preview.src = re.target.result; preview.classList.remove('hidden'); }
            };
            reader.readAsDataURL(file);
        };

        const init = async () => {
            render();
            if (isFirebaseEnabled) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try { await signInWithCustomToken(auth, __initial_auth_token); } catch (e) { await signInAnonymously(auth); }
                    } else { await signInAnonymously(auth); }

                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            onSnapshot(
                                collection(db, 'artifacts', appId, 'public', 'data', 'reports'), 
                                (snap) => {
                                    let dbData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                    const baseIds = INITIAL_REPORTS.map(r => r.id);
                                    const filteredDb = dbData.filter(d => !baseIds.includes(d.id));
                                    window.appState.reports = [...INITIAL_REPORTS, ...filteredDb];
                                    window.appState.reports.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                                    if (window.appState.currentView === 'list') render();
                                },
                                (error) => {
                                    console.error("Error en Firebase Snapshot:", error);
                                }
                            );
                        }
                    });
                } catch (err) { console.error("Sync error", err); }
            }
        };
        init();
    </script>
</head>
<body><div id="root"></div></body>
</html>

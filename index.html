<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Reportes - Coordinación | Coosajo Micoope</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- CONFIGURACIÓN FIREBASE (Sincronizada con index.html) ---
        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) { console.error("Error config"); }

        let db, auth, appId;
        const isFirebaseEnabled = firebaseConfig !== null && firebaseConfig.apiKey;
        if (isFirebaseEnabled) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'coosajo-prod-v6';
        }

        const COLORS = { blue: '#172e59', green: '#158e45' };

        // Reportes base fijos
        const INITIAL_REPORTS = [
            {
                id: "reporte-abril-original",
                reportTitle: 'Reporte de Plazas - Abril',
                campaignName: '¡Estamos creciendo contigo!',
                startDate: '2026-04-16',
                endDate: '2026-04-30',
                reach: 8932,
                results: 244,
                investment: 197.83,
                ctr: 6.49,
                interactions: 469,
                status: 'FINALIZADA',
                executiveSummary: 'Análisis detallado de la campaña de reclutamiento finalizada. La estrategia digital ha mantenido una eficiencia de costos sobresaliente.',
                conclusions: 'Se recomienda mantener el protocolo de atención ágil para maximizar resultados.',
                createdAt: '2026-04-30T23:59:59.000Z'
            },
            {
                id: "reporte-fase-1",
                reportTitle: 'Análisis de Atracción - Fase 1',
                campaignName: '¡Estamos creciendo contigo! (Fase 1)',
                startDate: '2026-04-01',
                endDate: '2026-04-15',
                reach: 7500,
                results: 180,
                investment: 150.00,
                ctr: 5.80,
                interactions: 320,
                status: 'FINALIZADA',
                executiveSummary: 'Informe de los esfuerzos iniciales de captación regional.',
                conclusions: 'La fase inicial demostró buena respuesta del mercado local a las vacantes.',
                createdAt: '2026-04-15T23:59:59.000Z'
            }
        ];

        window.appState = {
            user: null,
            reports: [...INITIAL_REPORTS],
            currentView: 'login',
            selectedReport: null
        };

        const render = () => {
            const root = document.getElementById('root');
            if (!root) return;
            const view = window.appState.currentView;
            if (view === 'login') root.innerHTML = LoginView();
            else if (view === 'list') root.innerHTML = ListView();
            else if (view === 'view') root.innerHTML = ReportView();
            setupEventListeners();
        };

        const LoginView = () => `
            <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                <div class="max-w-md w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-gray-100 animate-fade-in">
                    <div class="p-12 text-center" style="background-color: ${COLORS.blue}">
                        <div class="bg-white p-3 rounded-full w-24 h-24 mx-auto mb-6 shadow-xl flex items-center justify-center border-4 border-[#158e45]">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100?text=COOSAJO'">
                        </div>
                        <h2 class="text-white text-2xl font-black uppercase tracking-tight">Visor Ejecutivo</h2>
                        <p class="text-white/50 text-[10px] font-bold tracking-[0.3em] uppercase mt-1">Coosajo Micoope | Coordinación</p>
                    </div>
                    <form id="loginForm" class="p-10 space-y-6">
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Usuario</label>
                            <input type="text" id="username" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Ingrese su usuario">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Contraseña</label>
                            <input type="password" id="password" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="••••••••">
                        </div>
                        <div id="loginError" class="hidden text-red-500 text-xs font-bold text-center bg-red-50 p-3 rounded-xl"></div>
                        <button type="submit" class="w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-xl hover:brightness-110" style="background-color: ${COLORS.blue}">Ver Reportes</button>
                    </form>
                </div>
            </div>
        `;

        const ListView = () => `
            <div class="min-h-screen bg-[#f8fafc] font-sans">
                <nav class="sticky top-0 z-50 text-white p-4 shadow-xl" style="background-color: ${COLORS.blue}">
                    <div class="max-w-7xl mx-auto flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="h-10 bg-white rounded-full p-1 border border-white">
                            <h1 class="font-black uppercase tracking-tighter text-lg hidden md:block">Panel Coordinación</h1>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="text-[10px] font-bold uppercase bg-white/10 px-3 py-1 rounded-full border border-white/10">Solo Lectura</span>
                            <button onclick="logout()" class="text-white/40 hover:text-white transition-colors"><i class="fa-solid fa-sign-out"></i></button>
                        </div>
                    </div>
                </nav>
                <main class="max-w-7xl mx-auto p-8 space-y-10 animate-fade-in">
                    <div>
                        <h2 class="text-4xl font-black" style="color: ${COLORS.blue}">Bandeja de Resultados</h2>
                        <p class="text-gray-400 font-medium italic">Historial de informes generados por Elián Martinez.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${window.appState.reports.map((r) => `
                            <div onclick="openReport('${r.id}')" class="bg-white p-8 rounded-[3rem] shadow-sm hover:shadow-2xl transition-all cursor-pointer group border border-gray-100 relative overflow-hidden">
                                <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center text-2xl mb-6 group-hover:bg-[#172e59] group-hover:text-white transition-all shadow-inner"><i class="fa-solid fa-chart-column"></i></div>
                                <h4 class="font-bold text-xl mb-1 line-clamp-1" style="color: ${COLORS.blue}">${r.reportTitle}</h4>
                                <p class="text-[10px] text-gray-400 font-black uppercase mb-6">${new Date(r.createdAt).toLocaleDateString()}</p>
                                <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-[#158e45] bg-green-50 px-3 py-2 rounded-full">
                                    <span>Postulantes: ${r.results.toLocaleString()}</span>
                                    <i class="fa-solid fa-eye ml-2 opacity-50"></i>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </main>
            </div>
        `;

        const ReportView = () => {
            const r = window.appState.selectedReport;
            if (!r) return `<div class="p-20 text-center">Cargando reporte...</div>`;
            const formatDate = (dateStr) => new Date(dateStr + "T12:00:00").toLocaleDateString('es-GT', { day: 'numeric', month: 'long' });
            return `
                <div class="bg-[#f0f4f8] min-h-screen pb-20 font-sans animate-fade-in">
                    <nav class="text-white p-4 shadow-xl sticky top-0 z-50 no-print" style="background-color: ${COLORS.blue}">
                        <div class="max-w-7xl mx-auto flex justify-between items-center">
                            <button onclick="changeView('list')" class="font-black uppercase text-xs flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Volver</button>
                            <div class="flex gap-3">
                                <button onclick="celebrate()" class="bg-[#158e45] px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg hover:scale-105 transition-transform"><i class="fa-solid fa-trophy mr-1"></i> Éxito</button>
                                <button onclick="window.print()" class="bg-white/10 px-4 py-2 rounded-xl text-[10px] font-black uppercase border border-white/20"><i class="fa-solid fa-print"></i></button>
                            </div>
                        </div>
                    </nav>
                    <main class="max-w-6xl mx-auto px-4 py-12 space-y-20">
                        <div class="text-center space-y-4">
                            <h2 class="text-5xl md:text-7xl font-black tracking-tight" style="color: ${COLORS.blue}">Análisis de Resultados</h2>
                            <p class="text-2xl text-gray-500 italic">Campaña: <span class="font-bold text-[#158e45]">"${r.campaignName}"</span></p>
                            <div class="flex justify-center pt-4"><div class="h-2 w-48 rounded-full" style="background-color: ${COLORS.green}"></div></div>
                        </div>

                        <section class="bg-white rounded-[3rem] p-10 md:p-16 shadow-2xl border-l-[16px] relative overflow-hidden" style="border-left-color: ${COLORS.green}">
                            <div class="absolute -top-12 -right-12 opacity-5 w-80 h-80 rounded-full" style="background-color: ${COLORS.blue}"></div>
                            <div class="grid md:grid-cols-5 gap-12 relative z-10">
                                <div class="md:col-span-3 space-y-8">
                                    <h3 class="text-4xl font-black" style="color: ${COLORS.blue}">Resumen Ejecutivo</h3>
                                    <div class="inline-flex items-center gap-4 text-white px-6 py-3 rounded-2xl shadow-xl" style="background-color: ${COLORS.blue}">
                                        <i class="fa-solid fa-calendar-check" style="color: ${COLORS.green}"></i>
                                        <span class="text-sm font-black uppercase tracking-widest">${formatDate(r.startDate)} — ${formatDate(r.endDate)}</span>
                                    </div>
                                    <p class="text-gray-600 text-xl leading-relaxed font-light">${r.executiveSummary}</p>
                                </div>
                                <div class="md:col-span-2 self-center">
                                    <div class="rounded-[2.5rem] p-8 text-white shadow-2xl" style="background-color: ${COLORS.blue}">
                                        <div class="flex items-center gap-4 mb-6">
                                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center p-2"><img src="LOGO COOSAJO SIN ESLOGAN.png" alt="L"></div>
                                            <p class="text-lg font-black leading-none uppercase tracking-widest">Facebook</p>
                                        </div>
                                        <div class="pt-4 border-t border-white/10 flex justify-between text-sm"><span>Estado:</span><span class="font-black text-green-300 uppercase">${r.status}</span></div>
                                        <div class="pt-2 flex justify-between text-sm"><span>Inversión:</span><span class="font-black">Q ${r.investment}</span></div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                            ${MetricBoxHTML("Alcance Único", r.reach, "fa-users", COLORS.blue)}
                            ${MetricBoxHTML("Interesados", r.results, "fa-user-check", COLORS.green)}
                            ${MetricBoxHTML("Costo Candidato", (r.investment/(r.results || 1)).toFixed(2), "fa-hand-holding-dollar", COLORS.blue, true)}
                        </div>

                        <section class="rounded-[4rem] p-12 md:p-20 text-white shadow-2xl relative overflow-hidden" style="background-color: ${COLORS.blue}">
                            <div class="max-w-4xl mx-auto space-y-12 relative z-10 text-center">
                                <h3 class="text-5xl font-black tracking-tight leading-tight">La Analogía del Reclutador</h3>
                                <div class="flex flex-col gap-4 items-center mb-16">
                                    <div class="bg-white/15 p-12 rounded-t-[5rem] text-center border-b border-white/5 w-full max-w-3xl shadow-2xl">
                                        <p class="text-3xl font-black">${r.reach.toLocaleString()} personas vieron el anuncio</p>
                                    </div>
                                    <div class="p-10 w-3/5 rounded-b-[4rem] shadow-2xl" style="background-color: ${COLORS.green}">
                                        <p class="text-5xl font-black leading-none">${r.results.toLocaleString()} Postulantes</p>
                                    </div>
                                </div>
                                <div class="bg-white/10 backdrop-blur-md rounded-[2.5rem] p-12 text-left space-y-6 border border-white/10">
                                    <p class="text-2xl italic font-light leading-relaxed">"Imagina que se ha colocado un módulo de reclutamiento con un gran cartel de <strong>'¡Contratando!'</strong> en una plaza local bastante concurrida."</p>
                                    <p class="text-gray-300 text-lg">El Alcance representa a todos los que pasaron por la plaza y voltearon a ver el anuncio. Sin embargo, los <strong>${r.results} interesados</strong> son quienes decidieron acercarse al módulo y preguntar: <span class="text-green-300 font-bold italic">"Me interesa esta plaza"</span>.</p>
                                </div>
                            </div>
                        </section>

                        <div class="bg-white rounded-[3rem] p-12 shadow-xl flex flex-col md:flex-row gap-10 items-center border border-gray-100 no-print">
                            <div class="w-24 h-24 rounded-full flex items-center justify-center text-white text-5xl shadow-lg shrink-0 animate-bounce-slow" style="background-color: ${COLORS.blue}"><i class="fa-solid fa-lightbulb"></i></div>
                            <div class="space-y-3">
                                <h3 class="text-3xl font-black" style="color: ${COLORS.blue}">Conclusión Estratégica</h3>
                                <p class="text-xl text-gray-600 font-light leading-relaxed">${r.conclusions}</p>
                            </div>
                        </div>
                    </main>
                    <footer class="bg-gray-900 text-white py-16 text-center">
                        <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="h-16 mx-auto mb-6 bg-white p-2 rounded-full">
                        <p class="text-xs opacity-50 uppercase tracking-[0.4em] font-black">COOSAJO MICOOPE &copy; 2026</p>
                    </footer>
                </div>
            `;
        };

        const MetricBoxHTML = (title, val, icon, color, isQ) => `
            <div class="bg-white p-10 rounded-[3rem] shadow-xl border-b-[12px] transition-all hover:translate-y-[-5px]" style="border-bottom: 12px solid ${color}">
                <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center text-3xl mb-8 group-hover:scale-110 transition-transform" style="color: ${color}"><i class="fa-solid ${icon}"></i></div>
                <p class="text-gray-400 font-black uppercase text-[11px] tracking-widest mb-3">${title}</p>
                <h4 class="text-5xl font-black leading-none tracking-tighter" style="color: ${color}">${isQ ? '<span class="text-2xl text-gray-300 mr-2 font-bold">Q</span>' : ''}${Number(val).toLocaleString()}</h4>
            </div>
        `;

        const setupEventListeners = () => {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const u = document.getElementById('username').value;
                    const p = document.getElementById('password').value;
                    // Acceso permitido para ambos usuarios
                    if ((u === 'sjjardon' || u === 'sjemartinez') && p === 'Coosajo2041') {
                        window.appState.currentView = 'list';
                        render();
                    } else {
                        const err = document.getElementById('loginError');
                        err.textContent = 'Usuario o contraseña incorrectos.';
                        err.classList.remove('hidden');
                    }
                });
            }
        };

        window.changeView = (v) => { window.appState.currentView = v; render(); };
        window.logout = () => { window.appState.currentView = 'login'; render(); };
        window.openReport = (id) => {
            window.appState.selectedReport = window.appState.reports.find(r => r.id === id);
            window.appState.currentView = 'view';
            render();
            window.scrollTo(0,0);
        };
        window.celebrate = () => confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: [COLORS.green, COLORS.blue, '#ffffff'] });

        const init = async () => {
            render();
            if (isFirebaseEnabled) {
                try {
                    const resAuth = typeof __initial_auth_token !== 'undefined' ? await signInWithCustomToken(auth, __initial_auth_token) : await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'reports')), (snap) => {
                                let dbData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                const baseIds = INITIAL_REPORTS.map(r => r.id);
                                const filteredDb = dbData.filter(d => !baseIds.includes(d.id));
                                window.appState.reports = [...INITIAL_REPORTS, ...filteredDb];
                                window.appState.reports.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                                if (window.appState.currentView === 'list') render();
                            });
                        }
                    });
                } catch (err) { console.error("Sync error", err); }
            }
        };
        init();
    </script>
    <style>
        * { font-family: 'Poppins', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
        @media print { .no-print { display: none !important; } nav { display: none !important; } }
    </style>
</head>
<body><div id="root"></div></body>
</html>

        // --- GEMINI API CALL ---
        const callGemini = async (prompt, base64Image = null) => {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const contents = [{ parts: [{ text: prompt }] }];
                    if (base64Image) contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents,
                            systemInstruction: { parts: [{ text: "Eres un analista experto de reclutamiento de COOSAJO MICOOPE. Redacta análisis profesionales y analogías creativas usando guiones (-) para listas si es necesario. Responde con JSON estructurado si se solicita." }] }
                        })
                    });

                    if (!response.ok) throw new Error("API error");
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) { if (i === 4) throw err; await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');

            window.appState.aiChat.push({ role: 'user', text: text || "Analizando captura de resultados..." });

            render();

                const prompt = `Analiza esto para reporte de Coosajo. Extrae datos y redacta el análisis. Devuelve JSON al final entre etiquetas [JSON]: { "reportTitle": "...", "campaignName": "...", "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD", "reach": 0, "results": 0, "investment": 0, "ctr": 0, "interactions": 0, "executiveSummary": "...", "conclusions": "...", "analogyText": "..." }. Texto adicional: ${text}`;
                const response = await callGemini(prompt, window.appState.lastAnalyzedImage);
                
                const jsonMatch = response.match(/\[JSON\]:?\s*({[\s\S]*?})/);

                    const data = JSON.parse(jsonMatch[1]);
                    if(document.getElementById('rep_title')) document.getElementById('rep_title').value = data.reportTitle || '';

                    if(document.getElementById('rep_ctr')) document.getElementById('rep_ctr').value = data.ctr || '';

                    if(document.getElementById('rep_summary')) document.getElementById('rep_summary').value = data.executiveSummary || '';

                    if (validUser) {

            const createForm = document.getElementById('createForm');

                        status: 'FINALIZADA', 
                        createdAt: existingData.createdAt || new Date().toISOString()
                    };
                    
                    if (isFirebaseEnabled && auth.currentUser) {
                        try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', newReport.id), newReport); } catch (err) { console.error(err); }

                        if (window.appState.editingReportId) {
                            const idx = window.appState.reports.findIndex(r => r.id === window.appState.editingReportId);

                    window.appState.editingReportId = null; window.appState.currentView = 'list'; render();

            const addUserForm = document.getElementById('addUserForm');

                    } else {
                        window.appState.users.push(newUser);
                    }
                    render(); // Refrescar vista
                });
            }

            const aiInput = document.getElementById('aiImageInput');
            if (aiInput) {
                aiInput.addEventListener('change', (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader(); reader.onload = (re) => { window.appState.lastAnalyzedImage = re.target.result.split(',')[1]; sendMessage(); };
                    reader.readAsDataURL(file);
                });
            }

            if (window.appState.currentView === 'view') {
                window.onscroll = () => {
                    const scrolled = (document.documentElement.scrollTop / (document.documentElement.scrollHeight - document.documentElement.clientHeight)) * 100;

                    if(pb) pb.style.width = scrolled + "%";

        window.deleteReport = async (e, id) => { 
            e.stopPropagation(); 
            if(confirm("¿Eliminar este reporte permanentemente?")) { 
                if (isFirebaseEnabled && auth.currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', id)); 
                else { window.appState.reports = window.appState.reports.filter(r => r.id !== id); render(); } 
            } 
        };

        window.deleteUser = async (id) => {
            if(confirm("¿Eliminar usuario?")) {
                if (isFirebaseEnabled && auth.currentUser) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', id));
                else { window.appState.users = window.appState.users.filter(u => u.id !== id); render(); }
            }
        };

        window.celebrate = () => confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: [COLORS.green, COLORS.blue, '#ffffff'] });

        const init = async () => {
            render();
            if (isFirebaseEnabled) {
                try {
                    const resAuth = typeof __initial_auth_token !== 'undefined' && __initial_auth_token ? await signInWithCustomToken(auth, __initial_auth_token) : await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            // Cargar reportes
                            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'reports')), (snap) => {
                                let dbData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                const baseIds = INITIAL_REPORTS.map(r => r.id);
                                const filteredDb = dbData.filter(d => !baseIds.includes(d.id));
                                window.appState.reports = [...INITIAL_REPORTS, ...filteredDb];
                                window.appState.reports.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                                if (window.appState.currentView === 'list') render();
                            });
                            // Cargar usuarios
                            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'users')), (snap) => {
                                let dbData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                const baseIds = INITIAL_USERS.map(r => r.id);
                                const filteredDb = dbData.filter(d => !baseIds.includes(d.id));
                                window.appState.users = [...INITIAL_USERS, ...filteredDb];
                                if (window.appState.currentView === 'config') render();

                        }

        };
        init();

        * { font-family: 'Poppins', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .animate-bounce-slow { animation: bounce-slow 2s infinite ease-in-out; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        /* Permite saltos de linea en los textos generados */
        .whitespace-pre-wrap { white-space: pre-wrap; }
        @media print { .no-print { display: none !important; } nav { display: none !important; } }
    </style>
</head>

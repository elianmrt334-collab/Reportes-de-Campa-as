<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes | Coosajo Micoope</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- CONFIGURACIÓN SEGURA ---
        let firebaseConfig = {};
        try {
            if (typeof __firebase_config !== 'undefined') {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) {
            console.warn("Configuración no detectada.");
        }

        let db, auth, appId;
        const isFirebaseReady = firebaseConfig && firebaseConfig.apiKey;

        if (isFirebaseReady) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'coosajo-final-v7'; // Actualizado versión 7
        }

        const COLORS = { blue: '#172e59', green: '#158e45' };

        // --- REPORTES MAESTROS INICIALES ---
        const INITIAL_REPORT_RECLUTAMIENTO = {
            id: "reporte-reclutamiento-original",
            type: "reclutamiento",
            reportTitle: 'Plaza de Guate',
            campaignName: 'Plaza de Guate',
            startDate: '2026-04-16',
            endDate: '2026-04-30',
            reach: 8932,
            results: 244,
            investment: 197.83,
            ctr: 6.49,
            interactions: 469,
            status: 'FINALIZADA',
            executiveSummary: 'Se presenta a usted el análisis detallado de la campaña de reclutamiento finalizada. Durante este periodo de 15 días, la estrategia digital ha mantenido una eficiencia de costos sobresaliente para COOSAJO MICOOPE.',
            conclusions: 'Se le recomienda que el equipo encargado de contactar a esos postulantes mantenga un protocolo ágil de contacto para capitalizar la inversión de realizada.',
            createdAt: '2026-04-30T23:59:59.000Z'
        };

        const INITIAL_REPORT_CAMPANA = {
            id: "reporte-campana-ejemplo",
            type: "campana",
            reportTitle: 'Plaza del Chal',
            campaignName: 'Plaza del Chal',
            startDate: '2026-04-28',
            endDate: '2026-05-04',
            status: 'FINALIZADA',
            investment: 293.52,
            reach: 10336,
            impressions: 26989,
            frequency: 2.6,
            conversations: 19,
            resultType: 'Me gusta en Facebook',
            results: 104,
            interactions: 382,
            reactions: 56,
            ctr: 2.66,
            createdAt: '2026-05-04T23:59:59.000Z'
        };

        window.appState = {
            user: null,
            reports: [INITIAL_REPORT_CAMPANA, INITIAL_REPORT_RECLUTAMIENTO],
            currentView: 'login',
            selectedReport: null,
            createType: 'reclutamiento' // Tipo por defecto al abrir el formulario
        };

        const render = () => {
            const root = document.getElementById('root');
            const view = window.appState.currentView;
            
            if (view === 'login') root.innerHTML = LoginView();
            else if (view === 'list') root.innerHTML = ListView();
            else if (view === 'create') root.innerHTML = CreateView(); // Vista unificada
            else if (view === 'view') root.innerHTML = ReportView();
            
            setupEventListeners();
        };

        // --- VISTAS GLOBALES ---
        const LoginView = () => `
            <div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                <div class="max-w-md w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-gray-100 animate-fade-in">
                    <div class="p-12 text-center" style="background-color: ${COLORS.blue}">
                        <div class="bg-white p-3 rounded-full w-24 h-24 mx-auto mb-6 shadow-xl flex items-center justify-center border-4 border-[#158e45]">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100?text=COOSAJO'">
                        </div>
                        <h2 class="text-white text-2xl font-black uppercase tracking-tight">Portal de Reportes</h2>
                        <p class="text-white/50 text-[10px] font-bold tracking-[0.3em] uppercase mt-1">Coosajo Micoope</p>
                    </div>
                    <form id="loginForm" class="p-10 space-y-6">
                        <input type="text" id="username" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Usuario">
                        <input type="password" id="password" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Contraseña">
                        <div id="loginError" class="hidden text-red-500 text-xs font-bold text-center bg-red-50 p-3 rounded-xl"></div>
                        <button type="submit" class="w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-xl hover:brightness-110 active:scale-95 transition-all" style="background-color: ${COLORS.blue}">Ingresar</button>
                    </form>
                </div>
            </div>
        `;

        const ListView = () => `
            <div class="min-h-screen bg-[#f0f4f8]">
                <nav class="sticky top-0 z-50 text-white p-4 shadow-xl" style="background-color: ${COLORS.blue}">
                    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="changeView('list')">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="h-10 bg-white rounded-full p-1 border border-white" onerror="this.src='https://placehold.co/40x40?text=C'">
                            <h1 class="font-black uppercase tracking-tighter text-lg hidden md:block">Gestión de Reportes</h1>
                        </div>
                        <div class="flex gap-2 items-center">
                            <!-- UN SOLO BOTÓN PARA NUEVO INFORME -->
                            <button onclick="window.appState.createType='reclutamiento'; changeView('create')" class="bg-[#158e45] hover:bg-[#127a3b] px-6 py-2 flex items-center gap-2 rounded-xl text-xs font-black uppercase shadow-lg transition-colors">
                                <i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">Nuevo Informe</span>
                            </button>
                            <button onclick="logout()" class="text-white/40 hover:text-white transition-colors ml-4"><i class="fa-solid fa-sign-out text-lg"></i></button>
                        </div>
                    </div>
                </nav>
                <main class="max-w-7xl mx-auto p-8 space-y-8 animate-fade-in">
                    <h2 class="text-4xl font-black" style="color: ${COLORS.blue}">Historial de Actividad</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${window.appState.reports.map((r) => `
                            <div onclick="openReport('${r.id}')" class="bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-2xl transition-all cursor-pointer group relative border border-gray-50 overflow-hidden">
                                <div class="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center text-2xl mb-6" style="color: ${r.type === 'campana' ? COLORS.blue : COLORS.green}">
                                    <i class="fa-solid ${r.type === 'campana' ? 'fa-chart-pie' : 'fa-file-waveform'}"></i>
                                </div>
                                <h4 class="font-bold text-xl mb-1 line-clamp-1" style="color: ${COLORS.blue}">${r.reportTitle}</h4>
                                <p class="text-[10px] text-gray-400 font-black uppercase mb-4">${new Date(r.createdAt).toLocaleDateString()}</p>
                                <div class="flex gap-2 flex-wrap">
                                    <span class="text-[9px] bg-blue-50 px-2 py-1 rounded-full font-bold uppercase flex items-center gap-1" style="color: ${COLORS.blue}"><i class="fa-solid ${r.type === 'campana' ? 'fa-bullhorn' : 'fa-user-tie'}"></i> ${r.type === 'campana' ? 'Campaña Ads' : 'Reclutamiento'}</span>
                                    <span class="text-[9px] bg-green-50 px-2 py-1 rounded-full font-bold uppercase" style="color: ${COLORS.green}">${r.results} Res.</span>
                                </div>
                                ${(r.id !== 'reporte-reclutamiento-original' && r.id !== 'reporte-campana-ejemplo') ? `<button onclick="deleteReport(event, '${r.id}')" class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 text-gray-200 hover:text-red-500 transition-all"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </main>
            </div>
        `;

        // --- VISTA DE CREACIÓN UNIFICADA ---
        const CreateView = () => {
            const isAds = window.appState.createType === 'campana';
            
            return `
            <div class="min-h-screen bg-[#f0f4f8]">
                <nav class="text-white p-4 shadow-xl sticky top-0 z-50" style="background-color: ${COLORS.blue}">
                    <div class="max-w-7xl mx-auto flex items-center gap-4">
                        <button onclick="changeView('list')"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="font-black uppercase text-sm">Configurar Nuevo Informe</h1>
                    </div>
                </nav>
                <main class="max-w-4xl mx-auto p-8">
                    <div class="bg-white rounded-[3rem] shadow-2xl p-10 border border-gray-100">
                        
                        <!-- SELECTOR DE ESTRUCTURA -->
                        <div class="mb-10 p-6 bg-gray-50 rounded-3xl border border-gray-200 flex flex-col md:flex-row gap-6 items-center justify-between shadow-sm">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center shadow-sm text-xl" style="color: ${COLORS.green}">
                                    <i class="fa-solid fa-layer-group"></i>
                                </div>
                                <div>
                                    <h3 class="font-black text-gray-800 text-lg">Estructura del Reporte</h3>
                                    <p class="text-xs text-gray-500 mt-1">Elige qué tipo de datos vas a ingresar.</p>
                                </div>
                            </div>
                            <select onchange="window.appState.createType = this.value; render();" class="p-3 rounded-xl border border-gray-300 font-bold text-sm bg-white outline-none focus:ring-2 focus:ring-[#158e45] text-gray-700 min-w-[240px] shadow-sm cursor-pointer">
                                <option value="reclutamiento" ${!isAds ? 'selected' : ''}>👔 Reclutamiento (Plazas)</option>
                                <option value="campana" ${isAds ? 'selected' : ''}>📊 Campaña (Facebook Ads)</option>
                            </select>
                        </div>

                        <!-- FORMULARIO DINÁMICO -->
                        <form id="createForm" class="space-y-8 animate-fade-in">
                            ${isAds ? FormCampanaHTML() : FormReclutamientoHTML()}
                            
                            <button type="submit" class="w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-2xl hover:brightness-110 active:scale-95 transition-all mt-8" style="background-color: ${COLORS.blue}">
                                Guardar y Generar Reporte ${isAds ? 'Ads' : 'de Plazas'}
                            </button>
                        </form>
                    </div>
                </main>
            </div>
            `;
        };

        const FormReclutamientoHTML = () => `
            <div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2"><i class="fa-solid fa-user-tie mr-2" style="color:${COLORS.green}"></i>Datos de Reclutamiento</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Título del Reporte</label>
                        <input type="text" id="rep_title_r" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Ej: Reporte Mayo - Zona 1">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Campaña Facebook</label>
                        <input type="text" id="rep_camp_r" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="¡Estamos creciendo contigo!">
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Desde</label><input type="date" id="rep_start_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Hasta</label><input type="date" id="rep_end_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Alcance</label><input type="number" id="rep_reach_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Resultados</label><input type="number" id="rep_res_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                </div>
                <div class="grid grid-cols-3 gap-4 mt-4">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Inversión (Q)</label><input type="number" step="0.01" id="rep_inv_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">CTR (%)</label><input type="number" step="0.01" id="rep_ctr_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Interacciones</label><input type="number" id="rep_int_r" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                </div>
                <div class="space-y-4 pt-6 mt-4 border-t border-gray-100">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Redacción: Resumen Ejecutivo</label>
                        <textarea id="rep_summary_r" required rows="4" class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Escriba aquí el análisis inicial de la campaña..."></textarea>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Redacción: Conclusión Estratégica</label>
                        <textarea id="rep_conclusions_r" required rows="3" class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Escriba las recomendaciones finales para el equipo..."></textarea>
                    </div>
                </div>
            </div>
        `;

        const FormCampanaHTML = () => `
            <div>
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2"><i class="fa-solid fa-folder-open mr-2" style="color:${COLORS.green}"></i>1. Datos Generales (Ads)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Título Interno del Reporte</label>
                        <input type="text" id="rep_title_c" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Ej: Reporte Semanal - Zona 1">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black text-gray-400 uppercase tracking-widest ml-2">Nombre de la Campaña</label>
                        <input type="text" id="rep_camp_c" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Ej: plaza el chal peten Campaña">
                    </div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Desde</label><input type="date" id="rep_start_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Hasta</label><input type="date" id="rep_end_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]"></div>
                    <div>
                        <label class="text-[10px] font-black text-gray-400 ml-2">Estado</label>
                        <select id="rep_status_c" class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]">
                            <option value="FINALIZADA">Finalizada</option>
                            <option value="ACTIVA">Activa</option>
                        </select>
                    </div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Inversión (Q)</label><input type="number" step="0.01" id="rep_inv_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="293.52"></div>
                </div>
            </div>
            <div class="pt-2">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2"><i class="fa-solid fa-eye mr-2" style="color:${COLORS.green}"></i>2. Visibilidad</h3>
                <div class="grid grid-cols-3 gap-4">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Alcance Único</label><input type="number" id="rep_reach_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="10336"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Impresiones</label><input type="number" id="rep_imp_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="26989"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Frecuencia</label><input type="number" step="0.01" id="rep_freq_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="2.6"></div>
                </div>
            </div>
            <div class="pt-2">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4 border-b pb-2"><i class="fa-solid fa-bullseye mr-2" style="color:${COLORS.green}"></i>3. Resultados y Engagement</h3>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Tipo de Resultado</label><input type="text" id="rep_restype_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Ej: Me gusta en Facebook"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Cant. Resultados</label><input type="number" id="rep_res_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="104"></div>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Conversaciones</label><input type="number" id="rep_conv_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="19"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Interacciones (Total)</label><input type="number" id="rep_int_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="382"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">Reacciones</label><input type="number" id="rep_reac_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="56"></div>
                    <div><label class="text-[10px] font-black text-gray-400 ml-2">CTR (%)</label><input type="number" step="0.01" id="rep_ctr_c" required class="w-full p-3 rounded-xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="2.66"></div>
                </div>
            </div>
        `;

        // --- VISTA PRINCIPAL DE REPORTE ---
        const ReportView = () => {
            const r = window.appState.selectedReport;
            if (!r) return `<div class="p-20 text-center">Error al cargar datos.</div>`;
            const formatDate = (dateStr) => new Date(dateStr + "T12:00:00").toLocaleDateString('es-GT', { day: 'numeric', month: 'long', year: 'numeric' });
            
            return `
                <div class="bg-[#f0f4f8] min-h-screen pb-20">
                    <div id="report-progress" style="position:fixed; top:0; left:0; height:6px; background:linear-gradient(to right, ${COLORS.green}, ${COLORS.blue}); width:0%; z-index:100; transition:width 0.1s;"></div>
                    <nav class="text-white p-4 shadow-xl sticky top-0 z-50 no-print" style="background-color: ${COLORS.blue}">
                        <div class="max-w-7xl mx-auto flex justify-between items-center">
                            <button onclick="changeView('list')" class="font-black uppercase text-xs flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Historial</button>
                            <div class="flex gap-3">
                                <button onclick="celebrate()" class="bg-[#158e45] px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg"><i class="fa-solid fa-trophy"></i></button>
                                <button onclick="window.print()" class="bg-white/10 px-4 py-2 rounded-xl text-[10px] font-black uppercase"><i class="fa-solid fa-print"></i></button>
                            </div>
                        </div>
                    </nav>

                    <main class="max-w-6xl mx-auto px-4 py-12 space-y-20">
                        ${r.type === 'campana' ? RenderCampana(r, formatDate) : RenderReclutamiento(r, formatDate)}
                    </main>
                </div>
            `;
        };

        // RENDERIZADOR: RECLUTAMIENTO
        const RenderReclutamiento = (r, formatDate) => `
            <div class="text-center space-y-4 animate-fade-in">
                <h2 class="text-5xl md:text-7xl font-black tracking-tight" style="color: ${COLORS.blue}">Análisis de Resultados</h2>
                <p class="text-2xl text-gray-500 italic">Campaña: <span class="font-bold text-[#158e45]">"${r.campaignName}"</span></p>
                <div class="flex justify-center pt-4"><div class="h-2 w-48 rounded-full" style="background-color: ${COLORS.green}"></div></div>
            </div>

            <section class="bg-white rounded-[3rem] p-10 md:p-16 shadow-2xl border-l-[16px] relative overflow-hidden animate-fade-in" style="border-left-color: ${COLORS.green}; animation-delay: 0.2s;">

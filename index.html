<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes | Coosajo Micoope</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- CONFIGURACIÓN FIREBASE ---
        let firebaseConfig = null;
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                firebaseConfig = JSON.parse(__firebase_config);
            }
        } catch (e) { console.error("Config error"); }

        let db, auth, appId;
        const isFirebaseEnabled = firebaseConfig !== null && firebaseConfig.apiKey;
        if (isFirebaseEnabled) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'coosajo-prod-v6';
        }

        // --- GEMINI API CONFIG ---
        const apiKey = ""; // Se proporciona en tiempo de ejecución
        const GEMINI_MODEL = "gemini-2.5-flash-preview-09-2025";

        const COLORS = { blue: '#172e59', green: '#158e45' };

        const INITIAL_REPORTS = [
            {
                id: "reporte-abril-original",
                reportTitle: 'Reporte de Plazas - Abril',
                campaignName: '¡Estamos creciendo contigo!',
                startDate: '2026-04-16',
                endDate: '2026-04-30',
                reach: 8932,
                results: 244,
                investment: 197.83,
                ctr: 6.49,
                interactions: 469,
                status: 'FINALIZADA',
                executiveSummary: 'Se presenta a usted el análisis detallado de la campaña de reclutamiento finalizada. Durante este periodo de 15 días, la estrategia digital ha mantenido una eficiencia de costos sobresaliente para COOSAJO MICOOPE.',
                conclusions: 'Se le recomienda que el equipo encargado de contactar a esos postulantes mantenga un protocolo ágil de contacto para capitalizar la inversión realizada.',
                createdAt: '2026-04-30T23:59:59.000Z'
            },
            {
                id: "reporte-fase-1",
                reportTitle: 'Análisis de Atracción - Fase 1',
                campaignName: '¡Estamos creciendo contigo! (Fase 1)',
                startDate: '2026-04-01',
                endDate: '2026-04-15',
                reach: 7500,
                results: 180,
                investment: 150.00,
                ctr: 5.80,
                interactions: 320,
                status: 'FINALIZADA',
                executiveSummary: 'Este informe resume los esfuerzos iniciales de captación previos al cierre de mes. Se observó una tendencia positiva en la interacción local en las redes de Coosajo.',
                conclusions: 'La fase inicial demostró que el mercado responde bien a los estímulos visuales directos y mensajes claros de empleo.',
                createdAt: '2026-04-15T23:59:59.000Z'
            }
        ];

        window.appState = {
            user: null,
            reports: [...INITIAL_REPORTS],
            currentView: 'login',
            selectedReport: null,
            aiLoading: false,
            aiChat: [],
            lastAnalyzedImage: null
        };

        const render = () => {
            const root = document.getElementById('root');
            if (!root) return;
            const view = window.appState.currentView;
            
            if (view === 'login') root.innerHTML = LoginView();
            else if (view === 'list') root.innerHTML = ListView();
            else if (view === 'create') root.innerHTML = CreateView();
            else if (view === 'view') root.innerHTML = ReportView();
            
            setupEventListeners();
        };

        const LoginView = () => `
            <div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                <div class="max-w-md w-full bg-white rounded-[3rem] shadow-2xl overflow-hidden border border-gray-100 animate-fade-in">
                    <div class="p-12 text-center" style="background-color: ${COLORS.blue}">
                        <div class="bg-white p-3 rounded-full w-24 h-24 mx-auto mb-6 shadow-xl flex items-center justify-center border-4 border-[#158e45]">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100?text=COOSAJO'">
                        </div>

                        <input type="password" id="password" required class="w-full p-4 rounded-2xl bg-gray-50 border-none outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Contraseña">
                        <div id="loginError" class="hidden text-red-500 text-xs font-bold text-center bg-red-50 p-3 rounded-xl"></div>
                        <button type="submit" class="w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-xl hover:brightness-110 active:scale-95 transition-all" style="background-color: ${COLORS.blue}">Ingresar</button>
                    </form>
                </div>
            </div>
        `;

        const ListView = () => `
            <div class="min-h-screen bg-[#f0f4f8]">
                <nav class="sticky top-0 z-50 text-white p-4 shadow-xl" style="background-color: ${COLORS.blue}">
                    <div class="max-w-7xl mx-auto flex justify-between items-center">
                        <div class="flex items-center gap-3 cursor-pointer" onclick="changeView('list')">
                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="h-10 bg-white rounded-full p-1 border border-white" onerror="this.style.display='none'">
                            <h1 class="font-black uppercase tracking-tighter text-lg hidden md:block">Gestión de Reportes</h1>
                        </div>

                        </div>
                    </div>
                </nav>
                <main class="max-w-7xl mx-auto p-8 space-y-8 animate-fade-in">
                    <h2 class="text-4xl font-black" style="color: ${COLORS.blue}">Historial de Actividad</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${window.appState.reports.map((r) => `
                            <div onclick="openReport('${r.id}')" class="bg-white p-8 rounded-[2.5rem] shadow-sm hover:shadow-2xl transition-all cursor-pointer group relative border border-gray-50 overflow-hidden">

                                <h4 class="font-bold text-xl mb-1 line-clamp-1" style="color: ${COLORS.blue}">${r.reportTitle}</h4>
                                <p class="text-[10px] text-gray-400 font-black uppercase mb-4">${new Date(r.createdAt).toLocaleDateString()}</p>
                                <div class="flex gap-2">
                                    <span class="text-[9px] bg-blue-50 px-2 py-1 rounded-full font-bold uppercase" style="color: ${COLORS.blue}">${r.reach.toLocaleString()} Vistas</span>
                                    <span class="text-[9px] bg-green-50 px-2 py-1 rounded-full font-bold uppercase" style="color: ${COLORS.green}">${r.results} Interesados</span>
                                </div>
                                <button onclick="deleteReport(event, '${r.id}')" class="absolute top-6 right-6 opacity-0 group-hover:opacity-100 text-gray-200 hover:text-red-500 transition-all"><i class="fa-solid fa-trash-can"></i></button>

                        `).join('')}

            </div>
        `;

        const CreateView = () => `
            <div class="min-h-screen bg-[#f0f4f8]">
                <nav class="text-white p-4 shadow-xl sticky top-0 z-50" style="background-color: ${COLORS.blue}">
                    <div class="max-w-7xl mx-auto flex items-center gap-4">
                        <button onclick="changeView('list')"><i class="fa-solid fa-arrow-left"></i></button>
                        <h1 class="font-black uppercase text-sm">Nuevo Reporte</h1>
                    </div>
                </nav>
                <main class="max-w-6xl mx-auto p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- Formulario Manual -->
                    <div class="lg:col-span-2 space-y-6">
                        <div class="bg-white rounded-[3rem] shadow-xl p-10 border border-gray-100">
                            <form id="createForm" class="space-y-6">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div><label class="text-[10px] font-black text-gray-400">Desde</label><input type="date" id="rep_start" required class="w-full p-3 rounded-xl bg-gray-50 border-none"></div>
                                    <div><label class="text-[10px] font-black text-gray-400">Hasta</label><input type="date" id="rep_end" required class="w-full p-3 rounded-xl bg-gray-50 border-none"></div>
                                    <div><label class="text-[10px] font-black text-gray-400">Alcance</label><input type="number" id="rep_reach" required class="w-full p-3 rounded-xl bg-gray-50 border-none"></div>
                                    <div><label class="text-[10px] font-black text-gray-400">Resultados</label><input type="number" id="rep_res" required class="w-full p-3 rounded-xl bg-gray-50 border-none"></div>
                                </div>
                                <div class="grid grid-cols-3 gap-4">
                                    <input type="number" step="0.01" id="rep_inv" required class="w-full p-4 rounded-2xl bg-gray-50 border-none" placeholder="Inversión Q">
                                    <input type="number" step="0.01" id="rep_ctr" required class="w-full p-4 rounded-2xl bg-gray-50 border-none" placeholder="CTR %">
                                    <input type="number" id="rep_int" required class="w-full p-4 rounded-2xl bg-gray-50 border-none" placeholder="Interacciones">
                                </div>
                                <div class="space-y-4 pt-4 border-t">
                                    <textarea id="rep_summary" required rows="4" class="w-full p-4 rounded-2xl bg-gray-50 outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Resumen Ejecutivo..."></textarea>
                                    <textarea id="rep_conclusions" required rows="3" class="w-full p-4 rounded-2xl bg-gray-50 outline-none focus:ring-2 focus:ring-[#158e45]" placeholder="Conclusiones Estratégicas..."></textarea>
                                </div>
                                <button type="submit" class="w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest shadow-2xl hover:brightness-110 transition-all" style="background-color: ${COLORS.blue}">Guardar Informe</button>
                            </form>
                        </div>
                    </div>

                    <!-- Asistente IA -->
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-[#172e59] rounded-[3rem] shadow-2xl p-8 text-white relative overflow-hidden flex flex-col h-[700px]">
                            <div class="absolute top-0 right-0 p-10 opacity-5 rotate-12"><i class="fa-solid fa-brain text-[15rem]"></i></div>
                            
                            <div class="relative z-10 flex flex-col h-full">
                                <div class="flex items-center gap-3 mb-6">
                                    <div class="w-10 h-10 bg-[#158e45] rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-sparkles text-sm"></i></div>
                                    <div>
                                        <h3 class="font-black uppercase text-sm tracking-widest">Asistente IA</h3>
                                        <p class="text-[10px] opacity-60">Powered by Gemini</p>
                                    </div>
                                </div>

                                <!-- Chat Window -->
                                <div id="chatWindow" class="flex-grow bg-white/5 rounded-3xl p-4 overflow-y-auto space-y-4 mb-4 scrollbar-hide text-xs">
                                    <div class="bg-white/10 p-3 rounded-2xl rounded-tl-none max-w-[85%] border border-white/10">
                                        ¡Hola Elián! Sube una captura de tus resultados de Facebook o dime los datos y yo redactaré el reporte por ti.
                                    </div>
                                    ${window.appState.aiChat.map(m => `
                                        <div class="${m.role === 'user' ? 'ml-auto bg-[#158e45] text-right rounded-tr-none' : 'bg-white/10 text-left rounded-tl-none'} p-3 rounded-2xl max-w-[85%] break-words">
                                            ${m.text}
                                        </div>
                                    `).join('')}
                                    ${window.appState.aiLoading ? '<div class="animate-pulse text-green-300 font-bold">Gemini está analizando...</div>' : ''}
                                </div>

                                <!-- Actions -->
                                <div class="space-y-3 relative z-10">
                                    <label class="flex items-center justify-center gap-2 w-full py-4 bg-white/10 border border-dashed border-white/30 rounded-2xl cursor-pointer hover:bg-white/20 transition-all text-xs font-bold uppercase tracking-widest">
                                        <i class="fa-solid fa-camera"></i> Subir Captura
                                        <input type="file" id="aiImageInput" accept="image/*" class="hidden">
                                    </label>
                                    <div class="flex gap-2">
                                        <input type="text" id="chatInput" class="flex-grow bg-white/10 border border-white/20 rounded-2xl px-4 py-3 outline-none text-xs focus:bg-white/20" placeholder="Escribe aquí...">
                                        <button onclick="sendMessage()" class="w-12 h-12 bg-[#158e45] rounded-2xl flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-all">
                                            <i class="fa-solid fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

            </div>
        `;

        const ReportView = () => {
            const r = window.appState.selectedReport;
            if (!r) return `<div class="p-20 text-center">Error al cargar.</div>`;
            const formatDate = (dateStr) => new Date(dateStr + "T12:00:00").toLocaleDateString('es-GT', { day: 'numeric', month: 'long' });
            return `
                <div class="bg-[#f0f4f8] min-h-screen pb-20 relative animate-fade-in">
                    <div id="report-progress" style="position:fixed; top:0; left:0; height:6px; background:linear-gradient(to right, ${COLORS.green}, ${COLORS.blue}); width:0%; z-index:100;"></div>
                    <nav class="text-white p-4 shadow-xl sticky top-0 z-50 no-print" style="background-color: ${COLORS.blue}">
                        <div class="max-w-7xl mx-auto flex justify-between items-center">
                            <button onclick="changeView('list')" class="font-black uppercase text-xs flex items-center gap-2"><i class="fa-solid fa-arrow-left"></i> Historial</button>
                            <div class="flex gap-3">
                                <button onclick="celebrate()" class="bg-[#158e45] px-4 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg"><i class="fa-solid fa-trophy mr-1"></i> Éxito</button>
                                <button onclick="window.print()" class="bg-white/10 px-4 py-2 rounded-xl text-[10px] font-black uppercase"><i class="fa-solid fa-print"></i></button>
                            </div>
                        </div>
                    </nav>
                    <main class="max-w-6xl mx-auto px-4 py-12 space-y-20">
                        <div class="text-center space-y-4">
                            <h2 class="text-5xl md:text-7xl font-black tracking-tight" style="color: ${COLORS.blue}">Análisis de Resultados</h2>
                            <p class="text-2xl text-gray-500 italic font-light mt-2">Campaña: <span class="font-bold text-[#158e45]">"${r.campaignName}"</span></p>
                            <div class="flex justify-center pt-4"><div class="h-2 w-48 rounded-full" style="background-color: ${COLORS.green}"></div></div>
                        </div>
                        <section class="bg-white rounded-[3rem] p-10 md:p-16 shadow-2xl border-l-[16px] relative overflow-hidden" style="border-left-color: ${COLORS.green}">
                            <div class="absolute -top-12 -right-12 opacity-5 w-80 h-80 rounded-full" style="background-color: ${COLORS.blue}"></div>
                            <div class="grid md:grid-cols-5 gap-12 relative z-10">
                                <div class="md:col-span-3 space-y-8">
                                    <h3 class="text-4xl font-black" style="color: ${COLORS.blue}">Resumen Ejecutivo</h3>
                                    <div class="inline-flex items-center gap-4 text-white px-6 py-3 rounded-2xl shadow-xl" style="background-color: ${COLORS.blue}">
                                        <i class="fa-solid fa-calendar-check" style="color: ${COLORS.green}"></i>
                                        <span class="text-sm font-black uppercase tracking-widest">${formatDate(r.startDate)} — ${formatDate(r.endDate)}</span>
                                    </div>
                                    <p class="text-gray-600 text-xl leading-relaxed font-light">${r.executiveSummary}</p>
                                </div>
                                <div class="md:col-span-2 self-center">
                                    <div class="rounded-[2.5rem] p-8 text-white shadow-2xl" style="background-color: ${COLORS.blue}">
                                        <div class="flex items-center gap-5 mb-8">
                                            <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="w-12 h-12 bg-white rounded-full p-1" onerror="this.style.display='none'">
                                            <div><p class="text-[10px] uppercase opacity-50 font-black tracking-widest">Plataforma</p><p class="text-lg font-black leading-none">Facebook Ads</p></div>
                                        </div>
                                        <div class="pt-4 border-t border-white/10 flex justify-between text-sm"><span>Estado:</span><span class="font-black text-green-300 uppercase">${r.status}</span></div>
                                        <div class="pt-2 flex justify-between text-sm"><span>Inversión:</span><span class="font-black tracking-tight">Q ${r.investment}</span></div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                            ${MetricBoxHTML("Alcance Único", r.reach, "fa-users", COLORS.blue)}
                            ${MetricBoxHTML("Postulantes", r.results, "fa-user-check", COLORS.green)}
                            ${MetricBoxHTML("Costo Candidato", (r.investment/(r.results || 1)).toFixed(2), "fa-hand-holding-dollar", COLORS.blue, true)}
                        </div>

                        <section class="rounded-[4rem] p-12 md:p-20 text-white shadow-2xl relative overflow-hidden" style="background-color: ${COLORS.blue}">
                            <h3 class="text-5xl font-black tracking-tight leading-tight text-center mb-16">La Analogía del Reclutador</h3>
                            <div class="flex flex-col gap-4 items-center mb-16">
                                <div class="bg-white/15 p-12 rounded-t-[5rem] text-center border-b border-white/5 w-full max-w-3xl shadow-2xl"><p class="text-[10px] font-black uppercase mb-1 text-green-300">Fase 1: El Alcance</p><p class="text-3xl font-black">${r.reach.toLocaleString()} personas vieron el anuncio</p></div>
                                <div class="p-10 w-3/5 rounded-b-[4rem] shadow-2xl" style="background-color: ${COLORS.green}"><p class="text-[10px] font-black uppercase mb-1 text-white">Resultados Finales</p><p class="text-5xl font-black leading-none">${r.results.toLocaleString()} Postulantes</p></div>
                            </div>
                            <div class="bg-white/10 backdrop-blur-md rounded-3xl p-10 text-left space-y-6">
                                <p class="text-xl italic font-light">"Imagina que se ha colocado un módulo de reclutamiento con un gran cartel de <strong>'¡Contratando!'</strong> en una plaza local bastante concurrida."</p>
                                <p class="text-gray-300">El Alcance representa a todos los que pasaron por la plaza y voltearon a ver el anuncio. Sin embargo, los <strong>${r.results} interesados</strong> son quienes decidieron acercarse al módulo y preguntar: <span class="text-green-300 font-bold italic">"Me interesa esta plaza"</span>.</p>
                            </div>
                        </section>

                        <div class="bg-white rounded-[3rem] p-12 shadow-xl flex flex-col md:flex-row gap-10 items-center border border-gray-100 no-print">
                            <div class="w-24 h-24 rounded-full flex items-center justify-center text-white text-5xl shadow-lg shrink-0 animate-bounce-slow" style="background-color: ${COLORS.blue}"><i class="fa-solid fa-lightbulb"></i></div>
                            <div class="space-y-2">
                                <h3 class="text-3xl font-black" style="color: ${COLORS.blue}">Conclusión Estratégica</h3>
                                <p class="text-xl text-gray-600 font-light leading-relaxed">${r.conclusions}</p>
                            </div>
                        </div>
                    </main>
                    <footer class="bg-gray-900 text-white py-16 text-center">
                        <img src="LOGO COOSAJO SIN ESLOGAN.png" alt="Logo" class="h-16 mx-auto mb-6 bg-white p-2 rounded-full">
                        <p class="text-xs opacity-50 uppercase tracking-widest">Coosajo Micoope &copy; 2026</p>
                    </footer>
                </div>
            `;
        };

        const MetricBoxHTML = (title, val, icon, color, isQ) => `
            <div class="bg-white p-10 rounded-[3rem] shadow-xl border-b-[12px] transition-all hover:translate-y-[-5px]" style="border-bottom: 12px solid ${color}">
                <div class="w-16 h-16 bg-gray-50 rounded-2xl flex items-center justify-center text-3xl mb-8" style="color: ${color}"><i class="fa-solid ${icon}"></i></div>
                <p class="text-gray-400 font-black uppercase text-[11px] tracking-widest mb-3">${title}</p>
                <h4 class="text-5xl font-black leading-none" style="color: ${color}">${isQ ? '<span class="text-2xl text-gray-300 mr-2 font-bold">Q</span>' : ''}${Number(val).toLocaleString()}</h4>
            </div>
        `;

        // --- GEMINI LOGIC ---
        const callGemini = async (prompt, base64Image = null) => {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const contents = [{ parts: [{ text: prompt }] }];
                    if (base64Image) {
                        contents[0].parts.push({ inlineData: { mimeType: "image/png", data: base64Image } });
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents,
                            systemInstruction: { 
                                parts: [{ text: "Eres un analista experto de reclutamiento para COOSAJO MICOOPE. Tu tarea es extraer métricas de capturas de Facebook Ads y redactar análisis profesionales. Siempre intenta devolver los datos estructurados en JSON si se te pide, y redacta de 'usted', usando 'postulantes' y 'atracción de talento'." }] 
                            }
                        })
                    });

                    if (!response.ok) throw new Error("API Error");
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        };

        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text && !window.appState.lastAnalyzedImage) return;

            window.appState.aiChat.push({ role: 'user', text: text || "Analizando imagen..." });
            window.appState.aiLoading = true;
            render();

            try {
                const prompt = `Analiza esto para un reporte de Coosajo. Extrae si puedes: Título, Campaña, Fechas, Alcance, Resultados, Inversión, CTR e Interacciones. Redacta un Resumen Ejecutivo y Conclusiones. SIEMPRE responde con este formato JSON al final de tu mensaje entre etiquetas [JSON]: { "reportTitle": "...", "campaignName": "...", "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD", "reach": 0, "results": 0, "investment": 0, "ctr": 0, "interactions": 0, "executiveSummary": "...", "conclusions": "..." }. Texto adicional: ${text}`;
                
                const response = await callGemini(prompt, window.appState.lastAnalyzedImage);
                
                // Parse JSON from response if exists
                const jsonMatch = response.match(/\[JSON\]:?\s*({[\s\S]*?})/);
                if (jsonMatch) {
                    const data = JSON.parse(jsonMatch[1]);
                    document.getElementById('rep_title').value = data.reportTitle;
                    document.getElementById('rep_camp').value = data.campaignName;
                    document.getElementById('rep_start').value = data.startDate;
                    document.getElementById('rep_end').value = data.endDate;
                    document.getElementById('rep_reach').value = data.reach;
                    document.getElementById('rep_res').value = data.results;
                    document.getElementById('rep_inv').value = data.investment;
                    document.getElementById('rep_ctr').value = data.ctr;
                    document.getElementById('rep_int').value = data.interactions;
                    document.getElementById('rep_summary').value = data.executiveSummary;
                    document.getElementById('rep_conclusions').value = data.conclusions;
                }

                window.appState.aiChat.push({ role: 'assistant', text: response.replace(/\[JSON\][\s\S]*/, "He procesado los datos y rellenado el formulario por usted. ¿Desea ajustar algo del texto?") });
            } catch (err) {
                window.appState.aiChat.push({ role: 'assistant', text: "Lo siento Elián, hubo un error al conectar con Gemini. Por favor intenta de nuevo." });
            } finally {
                window.appState.aiLoading = false;
                window.appState.lastAnalyzedImage = null;
                input.value = "";
                render();
                const win = document.getElementById('chatWindow');
                win.scrollTop = win.scrollHeight;
            }
        };

        // --- EVENT LISTENERS ---
        const setupEventListeners = () => {
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (document.getElementById('username').value === 'sjemartinez' && document.getElementById('password').value === 'Coosajo2041') {
                        window.appState.currentView = 'list';
                        render();
                    } else {
                        const err = document.getElementById('loginError');
                        err.textContent = 'Credenciales Incorrectas';
                        err.classList.remove('hidden');
                    }
                });
            }

            const createForm = document.getElementById('createForm');
            if (createForm) {
                createForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const newReport = {
                        id: 'rep-' + Date.now(),
                        reportTitle: document.getElementById('rep_title').value,
                        campaignName: document.getElementById('rep_camp').value,
                        startDate: document.getElementById('rep_start').value,
                        endDate: document.getElementById('rep_end').value,
                        reach: Number(document.getElementById('rep_reach').value),
                        results: Number(document.getElementById('rep_res').value),
                        investment: Number(document.getElementById('rep_inv').value),
                        ctr: Number(document.getElementById('rep_ctr').value),
                        interactions: Number(document.getElementById('rep_int').value),
                        executiveSummary: document.getElementById('rep_summary').value,
                        conclusions: document.getElementById('rep_conclusions').value,
                        status: 'FINALIZADA',
                        createdAt: new Date().toISOString()
                    };
                    if (isFirebaseEnabled && auth.currentUser) {
                        try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), newReport); } catch (err) { console.error(err); }
                    } else {
                        window.appState.reports.unshift(newReport);
                    }
                    window.appState.currentView = 'list';
                    render();
                });
            }

            const aiInput = document.getElementById('aiImageInput');
            if (aiInput) {
                aiInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (re) => {
                        window.appState.lastAnalyzedImage = re.target.result.split(',')[1];
                        sendMessage(); // Trigger auto-analysis
                    };
                    reader.readAsDataURL(file);
                });
            }

            if (window.appState.currentView === 'view') {
                window.onscroll = () => {
                    const scrolled = (document.documentElement.scrollTop / (document.documentElement.scrollHeight - document.documentElement.clientHeight)) * 100;
                    const pb = document.getElementById("report-progress");
                    if(pb) pb.style.width = scrolled + "%";
                };
            }
        };

        window.changeView = (v) => { window.appState.currentView = v; render(); };
        window.logout = () => { window.appState.currentView = 'login'; render(); };
        window.openReport = (id) => {
            window.appState.selectedReport = window.appState.reports.find(r => r.id === id);
            window.appState.currentView = 'view';
            render();
            window.scrollTo(0,0);
        };
        window.deleteReport = async (e, id) => {
            e.stopPropagation();
            if(confirm("¿Eliminar este reporte permanentemente?")) {
                if (isFirebaseEnabled && auth.currentUser) {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reports', id));
                } else {
                    window.appState.reports = window.appState.reports.filter(r => r.id !== id);
                    render();
                }
            }
        };
        window.celebrate = () => confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: [COLORS.green, COLORS.blue, '#ffffff'] });

        const init = async () => {
            render();
            if (isFirebaseEnabled) {
                try {
                    const resAuth = typeof __initial_auth_token !== 'undefined' ? await signInWithCustomToken(auth, __initial_auth_token) : await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => {
                        if (u) {
                            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'reports')), (snap) => {
                                let dbData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                const baseIds = INITIAL_REPORTS.map(r => r.id);
                                const filteredDb = dbData.filter(d => !baseIds.includes(d.id));
                                window.appState.reports = [...INITIAL_REPORTS, ...filteredDb];
                                window.appState.reports.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                                if (window.appState.currentView === 'list') render();
                            });
                        }
                    });
                } catch (err) { console.error("Auth error", err); }
            }
        };
        init();
    </script>

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
